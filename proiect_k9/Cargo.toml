[package]
name = "proiect_k9"
version = "0.1.0"
edition = "2024"

[dependencies]
poise = "0.6.1"
tokio = { version = "1.33.0", features = ["macros", "rt-multi-thread"] }
serenity = { version = "0.12", features = ["client", "gateway", "rustls_backend", "model"] }
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "macros"] }
dotenvy = "0.15"
